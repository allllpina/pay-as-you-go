services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
      image: adminer
      restart: always
      ports:
        - "8080:8080"
      environment:
        ADMINER_DESIGN: 'nette'

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: pay_payment_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: "postgres"

volumes:
  pgdata:
